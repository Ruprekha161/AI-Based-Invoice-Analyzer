<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Invoice Analyzer - Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container animated fadeIn">
        <div class="auth-tabs">
            <button id="tab-login" class="active" onclick="switchTab('login')">Sign In</button>
            <button id="tab-register" onclick="switchTab('register')">Create Account</button>
        </div>

        <form id="login-form" class="auth-form" onsubmit="handleAuth(event, '/api/auth/login')">
            <h2>Welcome Back</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <form id="register-form" class="auth-form hidden" onsubmit="handleAuth(event, '/api/auth/register')">
            <h2>Register Account</h2>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-password" required>
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <div id="auth-error" class="error-msg"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
